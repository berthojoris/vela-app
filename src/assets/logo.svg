<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="60%" stop-color="#0a0c12"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Pulsar Energy Beam Gradient -->
    <linearGradient id="pulsar-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Star Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg-glow)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#232736" stroke-width="4"/>

  <!-- High-Speed Rotational Orbit Ring (Vela Pulsar Spin) -->
  <ellipse cx="256" cy="256" rx="170" ry="85" fill="none" stroke="url(#pulsar-beam)" stroke-width="5" stroke-dasharray="16 12" transform="rotate(-28 256 256)" opacity="0.6"/>

  <!-- Secondary Orbital Ring -->
  <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8 8" transform="rotate(32 256 256)" opacity="0.35"/>

  <!-- Central Cosmic Sail / Terminal Chevron (">") -->
  <path d="M185 150 L310 256 L185 362" fill="none" stroke="url(#cyan-glow)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Horizontal Beam Pulse (Prompt Cursor / Starlight Line "_") -->
  <line x1="335" y1="362" x2="385" y2="362" stroke="#a855f7" stroke-width="36" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Pulsar Core (Hyper-dense Neutron Star) -->
  <circle cx="310" cy="256" r="10" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="310" cy="256" r="5" fill="#e0f2fe"/>
</svg>
